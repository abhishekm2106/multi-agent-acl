[project]
name = "multi-agent-acl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek Mohanty", email = "abhishekm2106@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
